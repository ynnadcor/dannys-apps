name: Engine Academy iOS

on:
  push:
    branches: [main]
    paths:
      - "docs/engine-academy/**"
      - "apps/engine-academy/**"
      - ".github/workflows/engine-academy-ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: engine-academy-ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    env:
      VERSION: 1.0.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Bundle the web app
        run: |
          rm -rf apps/engine-academy/Web
          mkdir -p apps/engine-academy/Web
          cp docs/engine-academy/* apps/engine-academy/Web/

      - name: Generate Xcode project
        working-directory: apps/engine-academy
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: apps/engine-academy
        run: |
          xcodebuild -project EngineAcademy.xcodeproj -target EngineAcademy \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: apps/engine-academy
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/EngineAcademy.app Payload/
          zip -qry "$GITHUB_WORKSPACE/EngineAcademy.ipa" Payload
          ls -l "$GITHUB_WORKSPACE/EngineAcademy.ipa"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="engine-academy-v$VERSION"
          gh release create "$TAG" EngineAcademy.ipa \
            --title "Engine Academy $VERSION" \
            --notes "Unsigned build for SideStore or AltStore. Built from ${GITHUB_SHA::7}."

      - name: Update the app source
        run: |
          TAG="engine-academy-v$VERSION"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/EngineAcademy.ipa"
          MSG="$(git log -1 --pretty=%s)"
          python3 tools/update_source.py com.dannysapps.engineacademy "$VERSION" "$BUILD" EngineAcademy.ipa "$URL" "$MSG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/altstore-source.json
          git commit -m "Source: Engine Academy $VERSION"
          git pull --rebase origin main
          git push origin HEAD:main
